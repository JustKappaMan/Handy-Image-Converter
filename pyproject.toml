[project]
name = "handy-image-converter"
version = "1.0.0"
description = "Telegram bot to convert AVIF/JPEG/PNG/WEBP images"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9,<3.12"
dependencies = [
    "aiogram==2.25.2",
    "pillow==11.3.0",
]

[project.scripts]
handy-image-converter = "handy_image_converter.__main__:main"

[tool.uv]
package = true

[tool.ruff]
line-length = 120
